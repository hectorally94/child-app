<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Reel studio</title>
<style>
  html, body { margin: 0; background: #000; }
  #stage { position: relative; width: 540px; height: 960px; overflow: hidden; font-family: 'Nunito', system-ui, sans-serif; }
  .abs { position: absolute; }
  img { display: block; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="abs" style="inset:0"></div>
  <div id="deco" class="abs" style="inset:0"></div>
  <div id="mid" class="abs" style="inset:0"></div>
  <div id="chars" class="abs" style="inset:0"></div>
  <div id="fx" class="abs" style="inset:0"></div>
</div>
<script src="scenes.cjs"></script>
<script>
/*
 * Draws one cartoon at any time t (seconds): window.seek(t). Pure function of time, so render.cjs can
 * take a screenshot per frame and get perfectly synchronized video. No text is drawn (captions are added by the app).
 */
const { SCENES, TIMING: T, duration } = REELS;
const PIC = (c) => `../../public/pictures/${c}.svg`;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeOutBack = (x) => { x = clamp(x); const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); };
const easeInOut = (x) => { x = clamp(x); return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; };
const lerp = (a, b, x) => a + (b - a) * x;
const rand = (seed) => { let t = (seed * 2654435761) >>> 0; t = (t + 0x6d2b79f5) >>> 0; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; };

const PAL = {
  pipo: { light: '#fff1a8', mid: '#fbbf24', dark: '#f59e0b', wing: '#2563eb', tuft: '#ec4899', belly: '#ffeeb3' },
  tika: { light: '#c7f0ff', mid: '#38bdf8', dark: '#0284c7', wing: '#ec4899', tuft: '#10b981', belly: '#e0f6ff' },
};

/** The same round bird as the app's mascot, with a talking beak, blinking eyes and flapping wings. */
function bird(name, size, { mouth = 0, blink = false, wing = 0, happy = false, flip = false } = {}) {
  const p = PAL[name], id = name + size;
  const eyes = happy
    ? `<path d="M38 50 q7 -9 14 0" stroke="#2b2740" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M68 50 q7 -9 14 0" stroke="#2b2740" stroke-width="4.5" fill="none" stroke-linecap="round"/>`
    : `<ellipse cx="45" cy="50" rx="8" ry="${blink ? 1 : 9}" fill="#2b2740"/><ellipse cx="75" cy="50" rx="8" ry="${blink ? 1 : 9}" fill="#2b2740"/>${blink ? '' : '<circle cx="48" cy="46" r="3" fill="#fff"/><circle cx="78" cy="46" r="3" fill="#fff"/>'}`;
  const s = 0.3 + 0.7 * mouth;
  return `<svg viewBox="0 0 120 130" width="${size}" height="${size * 130 / 120}" style="transform:scaleX(${flip ? -1 : 1});overflow:visible">
    <defs>
      <radialGradient id="b${id}" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="${p.light}"/><stop offset=".55" stop-color="${p.mid}"/><stop offset="1" stop-color="${p.dark}"/></radialGradient>
      <radialGradient id="e${id}" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#fffdf2"/><stop offset="1" stop-color="${p.belly}"/></radialGradient>
    </defs>
    <ellipse cx="60" cy="116" rx="30" ry="5" fill="#2b2740" opacity=".12"/>
    <path d="M48 100 l-4 9 M48 100 l2 9 M72 100 l-2 9 M72 100 l4 9" stroke="#f97362" stroke-width="4" stroke-linecap="round"/>
    <path d="M58 18 C52 6 60 2 62 10 C64 2 72 6 64 18 Z" fill="${p.tuft}"/>
    <ellipse cx="60" cy="62" rx="42" ry="44" fill="url(#b${id})"/>
    <ellipse cx="60" cy="76" rx="25" ry="22" fill="url(#e${id})"/>
    <g transform="rotate(${-wing * 38} 26 66)"><path d="M20 62 C6 66 8 86 24 84 C30 80 30 68 20 62 Z" fill="${p.wing}"/></g>
    <g transform="rotate(${wing * 38} 94 66)"><path d="M100 62 C114 66 112 86 96 84 C90 80 90 68 100 62 Z" fill="${p.wing}"/></g>
    ${eyes}
    <ellipse cx="33" cy="64" rx="7" ry="4.5" fill="#ec4899" opacity=".35"/><ellipse cx="87" cy="64" rx="7" ry="4.5" fill="#ec4899" opacity=".35"/>
    <path d="M52 60 Q60 55 68 60 Q60 66 52 60 Z" fill="#f97362"/>
    <g transform="translate(0 62) scale(1 ${s}) translate(0 -62)"><path d="M53 62 Q60 66 67 62 Q60 72 53 62 Z" fill="#e2553f"/></g>
  </svg>`;
}

let scene = null;
function setup(id) {
  scene = SCENES.find((s) => s.id === id);
  document.getElementById('bg').style.background = `linear-gradient(180deg, ${scene.bg[0]} 0%, ${scene.bg[1]} 100%)`;
  const pics = new Set(['2b50', '1f31f']);
  scene.steps.forEach((s) => pics.add(s.pic));
  return Promise.all([...pics].map((c) => new Promise((res) => { const i = new Image(); i.onload = i.onerror = res; i.src = PIC(c); })));
}

const speaking = (t) => {
  const wins = [[0.4, 1.2]];
  scene.steps.forEach((_, i) => { const t0 = T.intro + i * T.step; wins.push([t0 + 0.4, t0 + 1.4], [t0 + 1.9, t0 + 3.0]); });
  const o = T.intro + scene.steps.length * T.step; wins.push([o + 0.3, o + 1.3]);
  return wins.some(([a, b]) => t >= a && t <= b);
};

function render(t) {
  const sc = scene, n = sc.steps.length, outroAt = T.intro + n * T.step, end = duration(sc);
  const night = !!sc.night;

  // soft floating decoration
  let deco = '';
  for (let i = 0; i < 7; i++) {
    const x = 540 * rand(i + 1) + 30 * Math.sin(t * 0.5 + i), y = 960 * rand(i + 40) + 24 * Math.cos(t * 0.4 + i * 2), r = 50 + 70 * rand(i + 80);
    deco += `<div class="abs" style="left:${x - r}px;top:${y - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:${night ? '#ffffff' : '#ffffff'};opacity:${night ? 0.05 : 0.28}"></div>`;
  }
  if (night) for (let i = 0; i < 22; i++) {
    const x = 540 * rand(i + 200), y = 520 * rand(i + 300), tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 1.6 + i));
    deco += `<div class="abs" style="left:${x}px;top:${y}px;width:6px;height:6px;border-radius:50%;background:#fff;opacity:${tw}"></div>`;
  }
  document.getElementById('deco').innerHTML = deco;

  // current step
  let mid = '';
  const idx = Math.floor((t - T.intro) / T.step);
  if (t >= T.intro && idx >= 0 && idx < n) {
    const st = sc.steps[idx], u = t - T.intro - idx * T.step;
    const s = easeOutBack(u / 0.55), ex = clamp((u - 3.3) / 0.3);
    const op = 1 - ex, dy = -40 * ex;
    const cx = 270, cy = 330 + dy;
    const wrap = (inner) => `<div class="abs" style="inset:0;opacity:${op}">${inner}</div>`;
    const ring = (k) => {
      if (u < 1.9) return '';
      const p = ((u - 1.9 + k * 0.45) % 1.3) / 1.3;
      return `<div class="abs" style="left:${cx - 170 - 110 * p}px;top:${cy - 170 - 110 * p}px;width:${340 + 220 * p}px;height:${340 + 220 * p}px;border-radius:50%;border:6px solid #fff;opacity:${0.65 * (1 - p)}"></div>`;
    };
    if (st.kind === 'pic' || st.kind === 'act') {
      const pulse = st.kind === 'act' && u > 1.8 ? 1 + 0.12 * Math.sin((u - 1.8) * Math.PI * 3.2) : 1 + 0.03 * Math.sin(u * 4);
      const size = 300 * s * pulse;
      mid = wrap(`
        <div class="abs" style="left:${cx - 190 * s}px;top:${cy - 190 * s}px;width:${380 * s}px;height:${380 * s}px;border-radius:50%;background:#fff;opacity:.6"></div>
        ${ring(0)}${ring(1)}
        <img class="abs" src="${PIC(st.pic)}" style="left:${cx - size / 2}px;top:${cy - size / 2 + 8 * Math.sin(u * 3)}px;width:${size}px;height:${size}px"/>`);
    } else if (st.kind === 'count') {
      let balloons = '';
      const per = st.n <= 3 ? st.n : 3, rows = st.n <= 3 ? 1 : 2;
      for (let i = 0; i < st.n; i++) {
        const row = i < per ? 0 : 1, inRow = row === 0 ? Math.min(per, st.n) : st.n - per, col = row === 0 ? i : i - per;
        const bx = 270 + (col - (inRow - 1) / 2) * 150, by = 250 + row * 160 + dy;
        const a = easeOutBack((u - 0.35 - 0.4 * i) / 0.45), size = 140 * a;
        balloons += `<img class="abs" src="${PIC(st.pic)}" style="left:${bx - size / 2}px;top:${by - size / 2 + 9 * Math.sin(u * 3 + i)}px;width:${size}px;height:${size}px"/>`;
      }
      const d = easeOutBack((u - 0.2) / 0.5), ds = 150 * d;
      mid = wrap(`${balloons}<div class="abs" style="left:${270 - ds / 2}px;top:${520 - ds / 2}px;width:${ds}px;height:${ds}px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:${ds * 0.7}px;color:#2563eb;box-shadow:0 8px 0 #bcd0ff">${st.n}</div>`);
    } else if (st.kind === 'color') {
      const size = 340 * s, ps = 210 * easeOutBack((u - 0.25) / 0.5);
      let drops = '';
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + 0.3, dist = 190 + 40 * rand(i + 5), p = easeOutBack((u - 0.1 - 0.04 * i) / 0.5), r = 16 * p;
        drops += `<div class="abs" style="left:${cx + Math.cos(a) * dist * p - r}px;top:${cy + Math.sin(a) * dist * p - r}px;width:${2 * r}px;height:${2 * r}px;border-radius:50%;background:${st.color}"></div>`;
      }
      mid = wrap(`${drops}<div class="abs" style="left:${cx - size / 2}px;top:${cy - size / 2}px;width:${size}px;height:${size}px;border-radius:50%;background:${st.color};box-shadow:inset -14px -18px 0 rgba(0,0,0,.14)"></div>
        ${ring(0)}<img class="abs" src="${PIC(st.pic)}" style="left:${cx - ps / 2}px;top:${cy - ps / 2 + 8 * Math.sin(u * 3)}px;width:${ps}px;height:${ps}px"/>`);
    }
  }
  document.getElementById('mid').innerHTML = mid;

  // characters
  const introP = easeInOut((t - 1.0) / 0.5);
  const bx = lerp(270, 130, introP), by = lerp(430, 660, introP), bsize = lerp(280, 190, introP);
  const hop = (() => {
    let h = 0;
    const marks = [0.4, ...sc.steps.map((_, i) => T.intro + i * T.step + 0.4), outroAt + 0.3];
    marks.forEach((m) => { const u = t - m; if (u >= 0 && u < 0.5) h = Math.max(h, 30 * Math.sin((u / 0.5) * Math.PI)); });
    return h;
  })();
  const outro = t >= outroAt, ou = t - outroAt;
  const jump = outro ? 50 * Math.abs(Math.sin(ou * 5)) * clamp(1.4 - ou / 2) : 0;
  const talking = speaking(t), blink = (t % 3.2) < 0.12;
  const wing = outro ? Math.abs(Math.sin(ou * 9)) : talking ? 0.35 * Math.abs(Math.sin(t * 7)) : 0.1 * Math.sin(t * 2);
  const pipo = bird('pipo', bsize, { mouth: talking ? 0.5 + 0.5 * Math.sin(t * 16) : 0, blink, wing, happy: outro && ou > 0.2 });
  let chars = `<div class="abs" style="left:${bx - bsize / 2}px;top:${by - bsize / 2 - hop - jump + 6 * Math.sin(t * 3)}px">${pipo}</div>`;
  if (sc.friend && t > 1.2) {
    const a = easeOutBack((t - 1.2) / 0.6), ts = 160 * a;
    const tika = bird('tika', 160, { mouth: talking && Math.floor(t * 2) % 2 ? 0.4 : 0, blink: (t + 1.3) % 3.4 < 0.12, wing: 0.1 * Math.sin(t * 2 + 1), happy: outro && ou > 0.2, flip: true });
    chars += `<div class="abs" style="left:${420 - 80}px;top:${690 - 87 - 5 * Math.sin(t * 3 + 1) - (outro ? 30 * Math.abs(Math.sin(ou * 5 + 1)) : 0)}px;transform:scale(${a});transform-origin:center bottom">${tika}</div>`;
  }
  document.getElementById('chars').innerHTML = chars;

  // outro: a big star and confetti
  let fx = '';
  if (outro) {
    const a = easeOutBack(ou / 0.7), size = 260 * a;
    fx += `<svg class="abs" viewBox="0 0 100 100" style="left:${270 - size / 2}px;top:${300 - size / 2}px;width:${size}px;height:${size}px;filter:drop-shadow(0 10px 14px rgba(217,119,6,.45))"><path d="M50 4l12.6 27.4 29.9 3.3-22.3 20.3 6.2 29.5L50 69.4 23.6 84.5l6.2-29.5L7.5 34.7l29.9-3.3L50 4Z" fill="#fbbf24" stroke="#fff" stroke-width="4" stroke-linejoin="round"/></svg>`;
    const cols = ['#2563eb', '#fbbf24', '#ec4899', '#10b981', '#7c3aed', '#f97362'];
    for (let i = 0; i < 46; i++) {
      const x0 = 540 * rand(i + 500), sp = 120 + 220 * rand(i + 600), y = -30 + sp * ou * 1.6 - 40 + ((rand(i + 700) * 120) - 60), life = clamp(1.3 - ou / 2.2);
      fx += `<div class="abs" style="left:${x0 + 30 * Math.sin(ou * 3 + i)}px;top:${y}px;width:${10 + 8 * rand(i + 800)}px;height:${6 + 6 * rand(i + 900)}px;background:${cols[i % cols.length]};border-radius:${i % 3 ? 2 : 6}px;transform:rotate(${ou * 300 * (rand(i + 1000) - 0.5) + i * 40}deg);opacity:${life}"></div>`;
    }
  }
  document.getElementById('fx').innerHTML = fx;
}

window.READY = false;
window.setupScene = async (id) => { await setup(id); window.READY = true; render(0); };
window.seek = (t) => render(t);
</script>
</body>
</html>
